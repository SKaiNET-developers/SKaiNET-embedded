# board.lock — the board ↔ Torq toolchain ↔ runtime combination this app is built and verified against.
# Read by scripts/board-audit.sh (read-only drift check). Change it only through docs/BOARD-UPDATE.md.
# Values are KEY=VALUE; anything after '#' is a comment.

# ---- Board image (current, verified 2026-10-16) ----
BOARD_SOC=SL2619                                  # device tree: "Synaptics SL2619 RDK", eMMC boot (root=/dev/mmcblk0p12)
BOARD_SDK=scarthgap_6.12_v2.4.0                   # Astra SDK; SYNA_SDK_REVISION 202605280005_202605291432
BOARD_KERNEL=6.12.62
BOARD_NPU_MODULE=/lib/modules/6.12.62/updates/syna_npu.ko
BOARD_GPU=Mali-G31 1 core                         # libmali 0.49.1 exports a Vulkan ICD, but no ICD json is registered

# ---- Torq toolchain (current) ----
TORQ_VERSION=2.0.0                                # pairs with Astra SDK v2.4.0
TORQ_COMPILER=sl2610-iree:v2.0.0                  # docker image (torq_compiler 2.0.0 wheel)
TORQ_IREE_BASE=3.10.0.dev                         # synaptics-torq/iree@43014101c8ab
TORQ_EXEC_FORMAT=2
APP_RUNTIME=libiree_torq_runtime.a (torq-compiler v2.0.0, self-built, local-task + torq + vulkan)
NPU_MULTIDISPATCH_TRUSTED=no                      # self-compiled multi-dispatch graphs return zeros on 2.0.0

# ---- Update target (see docs/BOARD-UPDATE.md; not applied yet) ----
TARGET_SDK=scarthgap_6.12_v2.6.0                  # latest with a plain sl2619 eMMC image; v2.6.1 lists coralboard variants only
TARGET_TORQ_VERSION=2.2.1                         # 2026-09-23; kernel-module deps built for Astra 2.5; still IREE 3.10
NEXT_TORQ_VERSION=2.3.0                           # 2026-10-19, after the flash: docs/BOARD-UPDATE.md Part 4; still IREE 3.10 (iree@585aecc)
